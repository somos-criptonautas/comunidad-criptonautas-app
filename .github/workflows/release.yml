name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build unsigned APK + AAB
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/android.keystore"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir dist
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk dist/aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/android.keystore" --ks-key-alias android \
            --ks-pass env:KEYSTORE_PASSWORD --pass-encoding utf-8 --out dist/criptonautas.apk dist/aligned.apk
          rm dist/aligned.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/criptonautas.aab
          jarsigner -keystore "$RUNNER_TEMP/android.keystore" -storepass:env KEYSTORE_PASSWORD \
            dist/criptonautas.aab android
          rm "$RUNNER_TEMP/android.keystore"
          "$BT/apksigner" verify --print-certs dist/criptonautas.apk
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes

      - name: Upload test build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: criptonautas
          path: dist/
